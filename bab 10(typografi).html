<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
rel="stylesheet"
/>
</head>
<body>
    <p class="h1">h1. Judul seperti heading</p>
     <p class="h2">h2. Judul seperti heading</p>

     <!--display heading-->
     <h1 class="display-1">display 1</h1>
     <h1 class="display-3">display 3</h1>

     <!--paragraf khusus-->
     <p class="lead">ini parafraf utama yang tampil lebih besar.</p>

     <!--inline text-->
     <p ><mark>untuk sorot text</mark></p>
     <p ><del>garis tengah pad teks</del></p>
     <p ><small>text kecil</small></p>
     <p ><strong>teks tebal</strong></p>
     <p ><em>teks miring</em></p>

     <!--alignment & style teks-->
     <p class="text-start">rata kiri</p> 
     <p class="text-center">rata tengah</p>
     <p class="text-end">rata kanan</p>

     <p class="text-uppercase">huruf besar semua</p>
     <p class="fw-bold">teks tebal</p> 
     <p class="fw-light">teks tipis</p>
    
     <!--blockquote-->
     <figure>
        <blockquote class="blockqoute">
            <p>kutipan penting dari seseorang.</p>
        </blockquote>
        <figcaption class="blockquote-footer">
            Nama Orang Dalam <cite title="judul sumber">judul sumber</cite>
        </figcaption>
    </figure>
</body>
</html>
